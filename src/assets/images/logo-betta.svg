<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A7E08C"/>
      <stop offset="1" stop-color="#6BC24A"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA6C9"/>
      <stop offset="1" stop-color="#EF4E96"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F76BAA"/>
      <stop offset="1" stop-color="#FFC2DD"/>
    </linearGradient>
    <radialGradient id="ear" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#FFD4E6"/>
      <stop offset="1" stop-color="#FF9CC5"/>
    </radialGradient>
  </defs>

  <!-- rounded green tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <circle cx="300" cy="260" r="360" fill="#FFFFFF" opacity="0.08"/>

  <!-- fish group: head to the left, flowing tail to the right -->
  <g transform="translate(-64,-8)">
    <!-- caudal (tail) fin: big flowing halfmoon -->
    <path d="M600 512
             C 720 360, 860 300, 900 320
             C 852 392, 852 420, 900 470
             C 848 496, 848 528, 900 554
             C 852 604, 852 632, 900 704
             C 860 724, 720 664, 600 512 Z"
          fill="url(#tail)"/>
    <g stroke="#E0559A" stroke-width="6" opacity="0.55" fill="none" stroke-linecap="round">
      <path d="M636 500 C 740 400, 830 360, 878 356"/>
      <path d="M648 512 C 760 470, 840 470, 892 470"/>
      <path d="M636 524 C 740 624, 830 664, 878 668"/>
    </g>

    <!-- dorsal fin (top) -->
    <path d="M470 430 C 500 300, 610 300, 660 452 C 590 408, 520 410, 470 430 Z" fill="url(#tail)" opacity="0.95"/>
    <!-- anal fin (bottom) -->
    <path d="M430 596 C 470 740, 620 736, 664 574 C 600 636, 500 640, 430 596 Z" fill="url(#tail)" opacity="0.95"/>

    <!-- body: teardrop -->
    <path d="M330 512
             C 330 430, 430 396, 560 452
             C 640 486, 660 512, 640 540
             C 660 540, 620 574, 560 574
             C 430 628, 330 594, 330 512 Z"
          fill="url(#body)"/>

    <!-- dumbo pectoral 'ear' fin -->
    <ellipse cx="470" cy="600" rx="86" ry="64" transform="rotate(24 470 600)" fill="url(#ear)" opacity="0.92"/>

    <!-- eye -->
    <circle cx="392" cy="500" r="30" fill="#2A1020"/>
    <circle cx="402" cy="490" r="10" fill="#FFFFFF"/>

    <!-- gill hint -->
    <path d="M440 470 C 452 500, 452 524, 440 556" stroke="#D64C90" stroke-width="7" fill="none" opacity="0.5" stroke-linecap="round"/>
  </g>
</svg>
